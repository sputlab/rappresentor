<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente Sfondo Pieno (Full Bleed per Maskable) -->
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="mTopGlow" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="mBookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <linearGradient id="mCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="mElevatedShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1329" flood-opacity="0.42"/>
    </filter>

    <filter id="mSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. Sfondo pieno 100% per Adaptive Icon Android -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>
  <rect width="512" height="512" fill="url(#mTopGlow)"/>

  <!-- 2. Gruppo Grafica Principale centrato e contenuto nella Safe Zone 80% (scale ~0.82) -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)" filter="url(#mElevatedShadow)">
    <!-- Libro Aperto Stylized -->
    <g transform="translate(0, 10)">
      <path d="M 256 360 C 210 330, 150 335, 116 350 C 104 355, 96 345, 98 332 C 104 290, 138 252, 192 248 C 228 245, 250 262, 256 272 Z"
            fill="url(#mBookGrad)"/>

      <path d="M 256 360 C 302 330, 362 335, 396 350 C 408 355, 416 345, 414 332 C 408 290, 374 252, 320 248 C 284 245, 262 262, 256 272 Z"
            fill="url(#mBookGrad)"/>

      <path d="M 256 270 C 262 285, 280 300, 280 315 C 280 335, 262 348, 256 360 C 250 348, 232 335, 232 315 C 232 300, 250 285, 256 270 Z"
            fill="#3b82f6"/>
      <circle cx="256" cy="315" r="9" fill="#ffffff"/>

      <path d="M 136 325 C 165 315, 205 315, 236 332" fill="none" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 148 298 C 175 290, 210 292, 238 308" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

      <path d="M 376 325 C 347 315, 307 315, 276 332" fill="none" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 364 298 C 337 290, 302 292, 274 308" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

      <path d="M 188 382 C 228 404, 284 404, 324 382" fill="none" stroke="url(#mGoldGrad)" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Tocco Accademico -->
    <path d="M 204 185 C 204 205, 308 205, 308 185 C 308 175, 204 175, 204 185 Z" fill="#0f172a"/>

    <polygon points="256,108 406,162 256,216 106,162" fill="url(#mCapGrad)"/>

    <polygon points="256,112 396,162 256,210 256,112" fill="#ffffff" fill-opacity="0.08"/>
    <polygon points="256,112 116,162 256,210 256,112" fill="#000000" fill-opacity="0.12"/>

    <path d="M 106 162 L 256 108 L 406 162" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6"/>

    <circle cx="256" cy="162" r="13" fill="url(#mGoldGrad)" filter="url(#mSoftGlow)"/>
    <circle cx="254" cy="159" r="4" fill="#ffffff" fill-opacity="0.8"/>

    <path d="M 256 162 C 320 166, 368 182, 376 226" fill="none" stroke="url(#mGoldGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="376" cy="228" r="7" fill="url(#mGoldGrad)"/>
    <path d="M 370 234 C 368 274, 384 274, 382 234 Z" fill="url(#mGoldGrad)"/>
    <line x1="373" y1="237" x2="371" y2="271" stroke="#d97706" stroke-width="1.5"/>
    <line x1="379" y1="237" x2="381" y2="271" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Stelle Guida -->
    <g transform="translate(398, 114)" filter="url(#mSoftGlow)">
      <path d="M 0 -22 Q 0 0, 22 0 Q 0 0, 0 22 Q 0 0, -22 0 Q 0 0, 0 -22 Z" fill="url(#mGoldGrad)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>

    <g transform="translate(112, 122) scale(0.65)" opacity="0.9">
      <path d="M 0 -18 Q 0 0, 18 0 Q 0 0, 0 18 Q 0 0, -18 0 Q 0 0, 0 -18 Z" fill="url(#mGoldGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
