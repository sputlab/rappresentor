<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sfondo gradiente principale -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Gradiente nappa e stella dorata -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gradiente scudo/accento -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Ombra morbida -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sfondo Icona Arrotondato Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Cerchio di luce d'accento sullo sfondo -->
  <circle cx="256" cy="180" r="190" fill="#3b82f6" opacity="0.25"/>

  <!-- Gruppo Icona Centrale con Ombra -->
  <g filter="url(#softShadow)">

    <!-- Scudo di Protezione e Collaborazione (Rappresentanza) -->
    <path d="M 256 180
             C 320 180, 360 210, 360 270
             C 360 350, 290 395, 256 415
             C 222 395, 152 350, 152 270
             C 152 210, 192 180, 256 180 Z"
          fill="url(#shieldGrad)"/>

    <!-- Dettaglio interno scudo: due figure/persone stilizzate che collaborano (scuola + famiglia) -->
    <!-- Genitore / Rappresentante (sinistra) -->
    <circle cx="224" cy="254" r="22" fill="#2563eb"/>
    <path d="M 188 320 C 188 288, 260 288, 260 320 Z" fill="#2563eb"/>

    <!-- Alunno / Bambino (destra) -->
    <circle cx="288" cy="272" r="16" fill="#f59e0b"/>
    <path d="M 262 322 C 262 298, 314 298, 314 322 Z" fill="#f59e0b"/>

    <!-- Stella Dorata al centro del petto/scudo (il merito della rappresentanza) -->
    <g transform="translate(256, 352) scale(0.9)" filter="url(#badgeShadow)">
      <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="url(#goldGrad)"/>
    </g>

    <!-- Tocco / Cappello Accademico (Tocco della Scuola) -->
    <!-- Base tesa inferiore -->
    <path d="M 196 160 C 196 178, 316 178, 316 160 C 316 142, 196 142, 196 160 Z" fill="#1e293b"/>

    <!-- Rombo superiore del tocco -->
    <polygon points="256,92 396,140 256,188 116,140" fill="#0f172a"/>
    <polygon points="256,98 384,140 256,182 128,140" fill="#1e293b"/>

    <!-- Bottone centrale del tocco -->
    <circle cx="256" cy="140" r="11" fill="url(#goldGrad)"/>

    <!-- Nappa dorata pendente a destra -->
    <path d="M 256 140 Q 340 150, 368 200" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Fiocco della nappa -->
    <rect x="362" y="196" width="12" height="8" rx="3" fill="url(#goldGrad)"/>
    <path d="M 362 204 L 358 244 L 378 244 L 374 204 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
